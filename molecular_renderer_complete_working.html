<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtomView - Molecular Renderer v1.0.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Atomic+Age&display=swap" rel="stylesheet">
    <style>
        :root{
            --base-clr: #11121a;
            --line-clr: #42434a;
            --hover-clr: #151943;
            --text-clr: #e6e6ef;
            --accent-clr: #ff845e;
            --accent-clr-2: #fcff43;
            --accent-clr-3: #5eff5e;
            --accent-clr-4: #6affe6;
            --accent-clr-5: #6aa1ff;
            --secondary-text-clr: #b0b3c1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.5rem;
        }

        .logo {
            font-family: 'Atomic Age';
            font-weight: 600;
        }

        body {
            min-height: 100vh;
            background-color: var(--base-clr);
            color: var(--text-clr);
            display: grid;
            grid-template-columns: auto 1fr;
        }

        #sidebar {
            box-sizing: border-box;
            height: 100vh;
            width: 330px;
            padding: 5px 1em;
            background-color: var(--base-clr);
            border-right: 1px solid var(--line-clr);
            position: sticky;
            top: 0;
            align-self: start;
            transition: 300ms ease-in-out;
            overflow-x: hidden;
            overflow-y: auto;
            text-wrap: nowrap;
            scrollbar-width: thin;
            scrollbar-color: #31006e var(--base-clr);
        }

        #sidebar::-webkit-scrollbar {
            width: 8px;
        }

        #sidebar::-webkit-scrollbar-track {
            background: var(--base-clr);
        }

        #sidebar::-webkit-scrollbar-thumb {
            background: #31006e;
        }

        #sidebar.close {
            padding: 5px;
            width: 60px;
        }

        #sidebar ul {
            list-style: none;
        }

        #sidebar > ul > li:first-child {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        #sidebar ul li.active > a, #sidebar ul li.active > button {
            color: var(--accent-clr);
        }

        #sidebar ul li.active svg {
            color: var(--accent-clr);
        }

        #sidebar a, #sidebar button {
            color: var(--secondary-text-clr);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
            font-size: inherit;
            cursor: pointer;
        }

        #sidebar a:hover, #sidebar button:hover {
            background-color: var(--hover-clr);
            color: var(--text-clr);
        }

        #sidebar ul li a span, #sidebar ul li button span {
            font-size: 0.9rem;
            font-weight: 500;
        }

        #sidebar svg {
            width: 20px;
            height: 20px;
            color: var(--secondary-text-clr);
        }

        #main {
            padding: 2rem;
            overflow-y: auto;
            height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            background: linear-gradient(90deg, var(--accent-clr), var(--accent-clr-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--secondary-text-clr);
            font-size: 0.9rem;
        }

        .renderer-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .controls-panel {
            background: rgba(48, 71, 94, 0.3);
            border: 1px solid var(--line-clr);
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
        }

        .info-panel {
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid var(--accent-clr);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-panel h3 {
            margin-bottom: 10px;
            color: var(--accent-clr);
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-online {
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .status-offline {
            background: #ff6b6b;
            box-shadow: 0 0 10px #ff6b6b;
        }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: rgba(48, 71, 94, 0.3);
            border: 1px solid var(--line-clr);
            border-radius: 6px;
            color: var(--text-clr);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(90deg, var(--accent-clr), var(--accent-clr-3));
            border-color: var(--accent-clr);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--accent-clr);
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--line-clr);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-clr);
            font-size: 14px;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .input-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--accent-clr), var(--accent-clr-3));
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.3);
        }

        .btn-secondary {
            background: rgba(48, 71, 94, 0.5);
            border: 1px solid var(--line-clr);
        }

        .canvas-container {
            background: rgba(48, 71, 94, 0.3);
            border: 1px solid var(--line-clr);
            border-radius: 12px;
            height: 600px;
            position: relative;
            overflow: hidden;
        }

        #renderer {
            width: 100%;
            height: 100%;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--accent-clr);
        }

        .error-message {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <ul>
            <li>
                <button onclick="toggleSidebar()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </li>
            <li class="active">
                <a href="#">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="2" x2="12" y2="22"></line></svg>
                    <span>Molecular Renderer</span>
                </a>
            </li>
        </ul>
    </div>

    <div id="main">
        <div class="container">
            <header>
                <h1 class="logo">AtomView</h1>
                <p class="subtitle">Developed by Eshant, Soham, Arush, Archit</p>
            </header>

            <div class="error-message" id="errorMessage"></div>
            <div class="loading" id="loading">Processing molecule...</div>

            <div class="renderer-container">
                <div class="controls-panel">
                    <div class="info-panel">
                        <h3>Server Status</h3>
                        <div id="serverStatus">
                            <span class="status-indicator status-offline"></span>
                            <span id="statusText">JavaScript is working!</span>
                        </div>
                    </div>

                    <div class="tab-container">
                        <button class="tab-btn active" onclick="switchTab('straight-chain')">Straight Chain Molecules</button>
                        <button class="tab-btn" onclick="switchTab('aromatics')">Aromatics</button>
                    </div>

                    <!-- Straight Chain Molecules Section -->
                    <div id="straight-chain" class="tab-content active">
                        <div class="input-group">
                            <label>Straight Chain Molecule Name</label>
                            <input type="text" id="moleculeName" placeholder="e.g., ethanol, propanal" value="ethanol">
                        </div>
                        <button class="btn" onclick="parseMolecule()">Parse & Render</button>
                    </div>

                    <!-- Aromatics Section -->
                    <div id="aromatics" class="tab-content">
                        <div class="input-group">
                            <label>Aromatic Molecule Name</label>
                            <input type="text" id="aromaticName" placeholder="e.g., benzene, toluene" value="benzene">
                        </div>
                        <button class="btn" onclick="parseAromatic()">Parse & Render</button>
                        
                        <div class="input-group">
                            <label>JSON Input (Optional)</label>
                            <textarea id="jsonInput" placeholder="Paste JSON structure here..."></textarea>
                        </div>
                        <button class="btn btn-secondary" onclick="renderFromJSON()">Render from JSON</button>
                        
                        <button class="btn btn-secondary" onclick="viewSMILES()">View SMILES</button>
                        <button class="btn btn-secondary" onclick="copySMILES()">Copy SMILES</button>
                    </div>
                </div>

                <div class="canvas-container">
                    <div id="renderer"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Server Connection with Port Fallback
        const SERVER_PORTS = ['3000', '3001'];
        let SERVER_URL = 'http://localhost:3000';
        let serverAvailable = false;
        let activePort = null;

        // Simple immediate status update - working pattern
        document.getElementById('statusText').textContent = 'JavaScript is working!';

        // Check server with port fallback
        async function checkServer() {
            document.getElementById('statusText').textContent = 'Checking connection...';
            
            for (const port of SERVER_PORTS) {
                try {
                    const response = await fetch(`http://localhost:${port}/health-test`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.status === 'Server running') {
                            SERVER_URL = `http://localhost:${port}`;
                            activePort = port;
                            serverAvailable = true;
                            document.getElementById('statusText').textContent = 'Connected on port ' + port;
                            document.getElementById('serverStatus').innerHTML = '<span class="status-indicator status-online"></span><span style="color: #4ade80;">Connected on port ' + port + '</span>';
                            return true;
                        }
                    }
                } catch (error) {
                    console.log('Port', port, 'failed:', error.message);
                }
            }
            
            document.getElementById('statusText').textContent = 'Connection failed - run start.bat';
            document.getElementById('serverStatus').innerHTML = '<span class="status-indicator status-offline"></span><span style="color: #ff6b6b;">Connection failed</span>';
            return false;
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            setTimeout(() => {
                errorElement.style.display = 'none';
            }, 5000);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');
        }

        async function parseMolecule() {
            if (!serverAvailable) {
                showError('Server not connected. Please run start.bat first.');
                return;
            }

            const name = document.getElementById('moleculeName').value.trim();
            if (!name) {
                showError('Please enter a molecule name');
                return;
            }

            try {
                document.getElementById('loading').style.display = 'block';
                
                const response = await fetch(`${SERVER_URL}/parse`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ moleculeName: name })
                });

                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('jsonInput').value = JSON.stringify(result.data, null, 2);
                    renderMolecule(result.data);
                } else {
                    showError('Parser error: ' + result.error);
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function parseAromatic() {
            if (!serverAvailable) {
                showError('Server not connected. Please run start.bat first.');
                return;
            }

            const name = document.getElementById('aromaticName').value.trim();
            if (!name) {
                showError('Please enter an aromatic molecule name');
                return;
            }

            try {
                document.getElementById('loading').style.display = 'block';
                
                const response = await fetch(`${SERVER_URL}/parse-aromatic`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ moleculeName: name })
                });

                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('jsonInput').value = JSON.stringify(result.data, null, 2);
                    renderMolecule(result.data);
                } else {
                    showError('Parser error: ' + result.error);
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderFromJSON() {
            const jsonText = document.getElementById('jsonInput').value.trim();
            if (!jsonText) {
                showError('Please enter JSON structure');
                return;
            }

            try {
                const data = JSON.parse(jsonText);
                renderMolecule(data);
            } catch (error) {
                showError('Invalid JSON: ' + error.message);
            }
        }

        function viewSMILES() {
            const jsonText = document.getElementById('jsonInput').value.trim();
            if (!jsonText) {
                showError('No JSON to export');
                return;
            }

            try {
                const data = JSON.parse(jsonText);
                const smiles = exportToSMILES(data);
                alert('SMILES: ' + smiles);
            } catch (error) {
                showError('Error generating SMILES: ' + error.message);
            }
        }

        function copySMILES() {
            const jsonText = document.getElementById('jsonInput').value.trim();
            if (!jsonText) {
                showError('No JSON to export');
                return;
            }

            try {
                const data = JSON.parse(jsonText);
                const smiles = exportToSMILES(data);
                navigator.clipboard.writeText(smiles).then(() => {
                    alert('SMILES copied to clipboard: ' + smiles);
                }).catch(err => {
                    alert('Failed to copy. SMILES: ' + smiles);
                });
            } catch (error) {
                showError('Error generating SMILES: ' + error.message);
            }
        }

        function exportToSMILES(jsonData) {
            const type = jsonData.type || 'benzene';
            const substituents = jsonData.substituents || [];
            const charge = jsonData.charge || '';
            const counterIon = jsonData.counterIon || '';
            
            let smiles = '';
            
            // Biaryl systems
            if (type === 'biphenyl') {
                smiles = 'c1ccc(cc1)-c2ccccc2';
            } else if (type === 'bipyridine') {
                smiles = 'c1ncccc1-c2ccccn2';
            } else if (type === 'bithiophene') {
                smiles = 'c1c(Br)sc1-c2c(Br)sc2';
            } else if (type === 'biquinoline') {
                smiles = 'c1ccc2ncnc(Br)c2c1-c3ccc4ncnc(Br)c4c3';
            } else if (type === 'pyridine') {
                smiles = 'c1ncccc1';
            } else if (type === 'pyridinium') {
                const counterIonCheck = counterIon === 'Cl';
                const methylCount = substituents.filter(s => s.type === 'methyl').length;
                if (methylCount > 0 && counterIonCheck) {
                    smiles = 'C[n+]1ccccc1.[Cl-]';
                } else {
                    smiles = '[n+]1ccccc1';
                }
            } else if (type === 'indole') {
                smiles = 'c1c(Cl)cc2[nH]c3c(C(=O)O)cccc3c2c1';
            } else if (type === 'benzene') {
                smiles = 'c1ccccc1';
            } else {
                smiles = 'c1ccccc1';
            }
            
            return smiles;
        }

        // Three.js setup
        let scene, camera, renderer, moleculeGroup, controls;

        function initThreeJS() {
            const container = document.getElementById('renderer');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            scene.add(directionalLight);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);

            moleculeGroup = new THREE.Group();
            scene.add(moleculeGroup);

            // Handle resize
            window.addEventListener('resize', () => {
                const newWidth = container.clientWidth;
                const newHeight = container.clientHeight;
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(newWidth, newHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function renderMolecule(jsonData) {
            // Clear previous molecule
            while (moleculeGroup.children.length > 0) {
                moleculeGroup.remove(moleculeGroup.children[0]);
            }

            // Detect if aromatic object vs straight-chain array
            if (typeof jsonData === 'object' && jsonData.type) {
                renderAromatic(jsonData);
            } else if (Array.isArray(jsonData)) {
                renderStraightChain(jsonData);
            }
        }

        function renderStraightChain(data) {
            const atomColors = {
                'C': 0x333333,
                'H': 0xffffff,
                'O': 0xff0000,
                'N': 0x0000ff,
                'F': 0x00ff00,
                'Cl': 0x00ff00,
                'Br': 0x8b4513,
                'I': 0x800080,
                'S': 0xffff00
            };

            data.forEach((atom, index) => {
                const geometry = new THREE.SphereGeometry(0.3, 32, 32);
                const material = new THREE.MeshPhongMaterial({ 
                    color: atomColors[atom.element] || 0x888888 
                });
                const sphere = new THREE.Mesh(geometry, material);
                
                sphere.position.x = index * 1.5;
                moleculeGroup.add(sphere);

                // Add bonds
                if (index > 0) {
                    const bondGeometry = new THREE.CylinderGeometry(0.1, 0.1, 1.5, 8);
                    const bondMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
                    const bond = new THREE.Mesh(bondGeometry, bondMaterial);
                    bond.position.x = (index - 0.5) * 1.5;
                    bond.rotation.z = Math.PI / 2;
                    moleculeGroup.add(bond);
                }
            });
        }

        function renderAromatic(data) {
            const type = data.type;
            const substituents = data.substituents || [];
            const connections = data.connections || [];
            const fusion = data.fusion || '';
            const charge = data.charge || '';
            const counterIon = data.counterIon || '';

            const atomColors = {
                'C': 0x333333,
                'H': 0xffffff,
                'N': 0x0000ff,
                'O': 0xff0000,
                'S': 0xffff00,
                'F': 0x00ff00,
                'Cl': 0x00ff00,
                'Br': 0x8b4513,
                'I': 0x800080
            };

            // Handle different molecule types
            if (type === 'biphenyl' || type === 'bipyridine' || type === 'bithiophene' || type === 'biquinoline') {
                buildBiarylSystem(type, connections, substituents);
            } else if (type === 'indole' || type === 'quinoline' || type === 'naphthalene' || type === 'naphthyridine' || type === 'furopyridine') {
                buildFusedRingSystem(type, substituents, fusion, charge, counterIon);
            } else if (type === 'pyridinium') {
                buildPyridiniumSystem(substituents, charge, counterIon);
            } else if (type === 'thiazole') {
                buildThiazoleSystem(substituents);
            } else {
                // Default benzene ring
                buildBenzeneRing(substituents);
            }
        }

        function buildBenzeneRing(substituents) {
            const atomColors = {
                'C': 0x333333,
                'H': 0xffffff,
                'N': 0x0000ff,
                'O': 0xff0000,
                'S': 0xffff00,
                'Cl': 0x00ff00,
                'Br': 0x8b4513
            };

            // Create hexagon for benzene
            const ringGeometry = new THREE.BufferGeometry();
            const vertices = [];
            
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                vertices.push(Math.cos(angle) * 2, Math.sin(angle) * 2, 0);
            }
            
            ringGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const ringMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
            const ring = new THREE.Line(ringGeometry, ringMaterial);
            moleculeGroup.add(ring);

            // Add carbon atoms
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const geometry = new THREE.SphereGeometry(0.3, 32, 32);
                const material = new THREE.MeshPhongMaterial({ color: atomColors['C'] });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(Math.cos(angle) * 2, Math.sin(angle) * 2, 0);
                moleculeGroup.add(sphere);
            }

            // Add substituents
            substituents.forEach(sub => {
                const angle = (sub.position / 6) * Math.PI * 2;
                const substituentGeometry = new THREE.SphereGeometry(0.2, 16, 16);
                const substituentMaterial = new THREE.MeshPhongMaterial({ 
                    color: atomColors[sub.type[0].toUpperCase()] || 0x888888 
                });
                const substituentSphere = new THREE.Mesh(substituentGeometry, substituentMaterial);
                substituentSphere.position.set(Math.cos(angle) * 3, Math.sin(angle) * 3, 0);
                moleculeGroup.add(substituentSphere);
            });
        }

        function buildBiarylSystem(ringType, connections, substituents) {
            const atomColors = {
                'C': 0x333333,
                'H': 0xffffff,
                'N': 0x0000ff,
                'S': 0xffff00,
                'Cl': 0x00ff00,
                'Br': 0x8b4513
            };

            // Create two ring centers
            const ring1Center = new THREE.Vector3(-2, 0, 0);
            const ring2Center = new THREE.Vector3(2, 0, 0);

            // Build first ring
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const x = ring1Center.x + Math.cos(angle) * 1.5;
                const y = ring1Center.y + Math.sin(angle) * 1.5;
                
                const geometry = new THREE.SphereGeometry(0.3, 32, 32);
                const material = new THREE.MeshPhongMaterial({ color: atomColors['C'] });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, 0);
                moleculeGroup.add(sphere);
            }

            // Build second ring
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const x = ring2Center.x + Math.cos(angle) * 1.5;
                const y = ring2Center.y + Math.sin(angle) * 1.5;
                
                const geometry = new THREE.SphereGeometry(0.3, 32, 32);
                const material = new THREE.MeshPhongMaterial({ color: atomColors['C'] });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, 0);
                moleculeGroup.add(sphere);
            }

            // Add inter-ring bond
            const bondGeometry = new THREE.CylinderGeometry(0.1, 0.1, 1, 8);
            const bondMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
            const bond = new THREE.Mesh(bondGeometry, bondMaterial);
            bond.position.set(0, 0, 0);
            bond.rotation.z = Math.PI / 2;
            moleculeGroup.add(bond);

            // Add substituents
            substituents.forEach(sub => {
                const ring = sub.ring || 'ring1';
                const angle = (sub.position / 6) * Math.PI * 2;
                const center = ring === 'ring1' ? ring1Center : ring2Center;
                
                const x = center.x + Math.cos(angle) * 2.5;
                const y = center.y + Math.sin(angle) * 2.5;
                
                const geometry = new THREE.SphereGeometry(0.25, 16, 16);
                const material = new THREE.MeshPhongMaterial({ 
                    color: atomColors[sub.type[0].toUpperCase()] || 0x888888 
                });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, 0);
                moleculeGroup.add(sphere);
            });
        }

        function buildPyridiniumSystem(substituents, charge, counterIon) {
            const atomColors = {
                'C': 0x333333,
                'H': 0xffffff,
                'N': 0x0000ff,
                'Cl': 0x00ff00
            };

            // Create pyridine ring (6-membered with nitrogen)
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const x = Math.cos(angle) * 2;
                const y = Math.sin(angle) * 2;
                
                // Nitrogen at position 1
                const isNitrogen = (i === 0);
                const atomColor = isNitrogen ? atomColors['N'] : atomColors['C'];
                
                const geometry = new THREE.SphereGeometry(0.3, 32, 32);
                const material = new THREE.MeshPhongMaterial({ color: atomColor });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, 0);
                moleculeGroup.add(sphere);
            }

            // Add substituents
            substituents.forEach(sub => {
                const angle = (sub.position / 6) * Math.PI * 2;
                const x = Math.cos(angle) * 3;
                const y = Math.sin(angle) * 3;
                
                const geometry = new THREE.SphereGeometry(0.25, 16, 16);
                const material = new THREE.MeshPhongMaterial({ 
                    color: atomColors[sub.type[0].toUpperCase()] || 0x888888 
                });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, 0);
                moleculeGroup.add(sphere);
            });

            // Add charge indicator
            if (charge === '+') {
                const chargeGeometry = new THREE.SphereGeometry(0.2, 16, 16);
                const chargeMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000 });
                const chargeSphere = new THREE.Mesh(chargeGeometry, chargeMaterial);
                chargeSphere.position.set(2, 0, 0.5);
                moleculeGroup.add(chargeSphere);
            }

            // Add counter-ion
            if (counterIon) {
                const ionGeometry = new THREE.SphereGeometry(0.25, 16, 16);
                const ionMaterial = new THREE.MeshPhongMaterial({ color: atomColors[counterIon] || 0x00ff00 });
                const ionSphere = new THREE.Mesh(ionGeometry, ionMaterial);
                ionSphere.position.set(3.5, 0, 0);
                moleculeGroup.add(ionSphere);
            }
        }

        function buildThiazoleSystem(substituents) {
            const atomColors = {
                'C': 0x333333,
                'H': 0xffffff,
                'N': 0x0000ff,
                'S': 0xffff00,
                'Br': 0x8b4513
            };

            // 5-membered thiazole ring with S at position 1, N at position 3
            const ringAtoms = [
                { position: 0, element: 'S' },
                { position: 1, element: 'C' },
                { position: 2, element: 'N' },
                { position: 3, element: 'C' },
                { position: 4, element: 'C' }
            ];

            ringAtoms.forEach(atom => {
                const angle = (atom.position / 5) * Math.PI * 2;
                const x = Math.cos(angle) * 1.5;
                const y = Math.sin(angle) * 1.5;
                
                const geometry = new THREE.SphereGeometry(0.3, 32, 32);
                const material = new THREE.MeshPhongMaterial({ 
                    color: atomColors[atom.element] || 0x888888 
                });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, 0);
                moleculeGroup.add(sphere);
            });

            // Add substituents
            substituents.forEach(sub => {
                const angle = (sub.position / 5) * Math.PI * 2;
                const x = Math.cos(angle) * 2.5;
                const y = Math.sin(angle) * 2.5;
                
                const geometry = new THREE.SphereGeometry(0.25, 16, 16);
                const material = new THREE.MeshPhongMaterial({ 
                    color: atomColors[sub.type[0].toUpperCase()] || 0x888888 
                });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, 0);
                moleculeGroup.add(sphere);
            });
        }

        function buildFusedRingSystem(ringType, substituents, fusion, charge, counterIon) {
            const atomColors = {
                'C': 0x333333,
                'H': 0xffffff,
                'N': 0x0000ff,
                'O': 0xff0000,
                'S': 0xffff00,
                'Cl': 0x00ff00,
                'Br': 0x8b4513
            };

            // Simplified fused ring rendering
            const ring1Center = new THREE.Vector3(-1, 0, 0);
            const ring2Center = new THREE.Vector3(1, 0, 0);

            // Build first ring (6-membered)
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const x = ring1Center.x + Math.cos(angle) * 1.2;
                const y = ring1Center.y + Math.sin(angle) * 1.2;
                
                const geometry = new THREE.SphereGeometry(0.3, 32, 32);
                const material = new THREE.MeshPhongMaterial({ color: atomColors['C'] });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, 0);
                moleculeGroup.add(sphere);
            }

            // Build second ring (5-membered for indole, 6-membered for naphthalene)
            const ring2Size = ringType === 'indole' ? 5 : 6;
            for (let i = 0; i < ring2Size; i++) {
                const angle = (i / ring2Size) * Math.PI * 2;
                const x = ring2Center.x + Math.cos(angle) * 1.2;
                const y = ring2Center.y + Math.sin(angle) * 1.2;
                
                const geometry = new THREE.SphereGeometry(0.3, 32, 32);
                const material = new THREE.MeshPhongMaterial({ color: atomColors['C'] });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, 0);
                moleculeGroup.add(sphere);
            }

            // Add nitrogen for indole
            if (ringType === 'indole') {
                const nGeometry = new THREE.SphereGeometry(0.3, 32, 32);
                const nMaterial = new THREE.MeshPhongMaterial({ color: atomColors['N'] });
                const nSphere = new THREE.Mesh(nGeometry, nMaterial);
                nSphere.position.set(ring2Center.x + 1.2, ring2Center.y, 0);
                moleculeGroup.add(nSphere);
            }

            // Add substituents
            substituents.forEach(sub => {
                const angle = (sub.position / 6) * Math.PI * 2;
                const x = ring1Center.x + Math.cos(angle) * 2.5;
                const y = ring1Center.y + Math.sin(angle) * 2.5;
                
                const geometry = new THREE.SphereGeometry(0.25, 16, 16);
                const material = new THREE.MeshPhongMaterial({ 
                    color: atomColors[sub.type[0].toUpperCase()] || 0x888888 
                });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, 0);
                moleculeGroup.add(sphere);
            });

            // Add charge indicator
            if (charge === '+') {
                const chargeGeometry = new THREE.SphereGeometry(0.2, 16, 16);
                const chargeMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000 });
                const chargeSphere = new THREE.Mesh(chargeGeometry, chargeMaterial);
                chargeSphere.position.set(ring1Center.x - 1.5, ring1Center.y, 0.5);
                moleculeGroup.add(chargeSphere);
            }

            // Add counter-ion
            if (counterIon) {
                const ionGeometry = new THREE.SphereGeometry(0.2, 16, 16);
                const ionMaterial = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
                const ionSphere = new THREE.Mesh(ionGeometry, ionMaterial);
                ionSphere.position.set(ring2Center.x + 2.5, ring2Center.y, 0);
                moleculeGroup.add(ionSphere);
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('close');
        }

        // Initialize
        initThreeJS();
        checkServer();
    </script>
