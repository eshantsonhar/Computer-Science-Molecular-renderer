<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtomView - Simple Version</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #eaeaea; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid #30475e; margin-bottom: 30px; }
        header h1 { font-size: 2.5em; background: linear-gradient(90deg, #e94560, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .server-status { text-align: center; padding: 15px; margin: 20px 0; border-radius: 8px; background: rgba(233, 69, 96, 0.1); border: 1px solid #e94560; }
        .status-indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        .status-online { background: #4ade80; box-shadow: 0 0 10px #4ade80; }
        .status-offline { background: #ff6b6b; box-shadow: 0 0 10px #ff6b6b; }
        .renderer-container { display: grid; grid-template-columns: 350px 1fr; gap: 20px; margin-top: 20px; }
        .controls-panel { background: rgba(48, 71, 94, 0.3); border: 1px solid #30475e; border-radius: 12px; padding: 20px; height: fit-content; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #e94560; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #30475e; border-radius: 6px; background: rgba(255, 255, 255, 0.05); color: #eaeaea; font-size: 14px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.3s ease; margin-bottom: 10px; background: linear-gradient(90deg, #e94560, #ff6b6b); color: white; }
        .canvas-container { background: rgba(48, 71, 94, 0.3); border: 1px solid #30475e; border-radius: 12px; height: 600px; position: relative; overflow: hidden; }
        #renderer { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AtomView - Molecular Renderer v1.0.0</h1>
            <p>Developed by Eshant, Soham, Arush, Archit</p>
        </header>

        <div class="server-status">
            <div id="serverStatus">
                <span class="status-indicator status-offline"></span>
                <span id="statusText">Testing connection...</span>
            </div>
        </div>

        <div class="renderer-container">
            <div class="controls-panel">
                <div class="input-group">
                    <label>Molecule Name</label>
                    <input type="text" id="moleculeName" placeholder="e.g., benzene, toluene" value="benzene">
                </div>
                <button class="btn" onclick="parseMolecule()">Parse & Render</button>
            </div>

            <div class="canvas-container">
                <div id="renderer"></div>
            </div>
        </div>
    </div>

    <script>
        const SERVER_PORTS = ['3000', '3001'];
        let SERVER_URL = 'http://localhost:3000';
        let serverAvailable = false;
        let activePort = null;

        // Simple immediate status update
        document.getElementById('statusText').textContent = 'JavaScript is working!';

        // Check server with port fallback
        async function checkServer() {
            document.getElementById('statusText').textContent = 'Checking connection...';
            
            for (const port of SERVER_PORTS) {
                try {
                    const response = await fetch(`http://localhost:${port}/health-test`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.status === 'Server running') {
                            SERVER_URL = `http://localhost:${port}`;
                            activePort = port;
                            serverAvailable = true;
                            document.getElementById('statusText').textContent = 'Connected on port ' + port;
                            document.getElementById('serverStatus').innerHTML = '<span class="status-indicator status-online"></span><span style="color: #4ade80;">Connected on port ' + port + '</span>';
                            return true;
                        }
                    }
                } catch (error) {
                    console.log('Port', port, 'failed:', error.message);
                }
            }
            
            document.getElementById('statusText').textContent = 'Connection failed - run start.bat';
            document.getElementById('serverStatus').innerHTML = '<span class="status-indicator status-offline"></span><span style="color: #ff6b6b;">Connection failed</span>';
            return false;
        }

        async function parseMolecule() {
            if (!serverAvailable) {
                alert('Server not connected. Please run start.bat first.');
                return;
            }

            const name = document.getElementById('moleculeName').value.trim();
            if (!name) {
                alert('Please enter a molecule name');
                return;
            }

            try {
                const response = await fetch(`${SERVER_URL}/parse-aromatic`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ moleculeName: name })
                });

                const result = await response.json();
                
                if (result.success) {
                    renderMolecule(result.data);
                } else {
                    alert('Parser error: ' + result.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Basic Three.js setup
        let scene, camera, renderer, moleculeGroup;

        function initThreeJS() {
            const container = document.getElementById('renderer');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            moleculeGroup = new THREE.Group();
            scene.add(moleculeGroup);

            window.addEventListener('resize', () => {
                const newWidth = container.clientWidth;
                const newHeight = container.clientHeight;
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(newWidth, newHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (moleculeGroup) {
                moleculeGroup.rotation.y += 0.005;
            }
            renderer.render(scene, camera);
        }

        function renderMolecule(data) {
            while (moleculeGroup.children.length > 0) {
                moleculeGroup.remove(moleculeGroup.children[0]);
            }

            const atomColors = {
                'C': 0x333333,
                'H': 0xffffff,
                'N': 0x0000ff,
                'O': 0xff0000,
                'S': 0xffff00
            };

            if (data.type === 'benzene') {
                const ringGeometry = new THREE.BufferGeometry();
                const vertices = [];
                
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    vertices.push(Math.cos(angle) * 2, Math.sin(angle) * 2, 0);
                }
                
                ringGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                const ringMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
                const ring = new THREE.Line(ringGeometry, ringMaterial);
                moleculeGroup.add(ring);

                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const geometry = new THREE.SphereGeometry(0.3, 32, 32);
                    const material = new THREE.MeshPhongMaterial({ color: atomColors['C'] });
                    const sphere = new THREE.Mesh(geometry, material);
                    sphere.position.set(Math.cos(angle) * 2, Math.sin(angle) * 2, 0);
                    moleculeGroup.add(sphere);
                }
            }
        }

        // Initialize
        initThreeJS();
        checkServer();
    </script>
</body>
</html>
