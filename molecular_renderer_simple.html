<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtomView - Molecular Renderer v1.0.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eaeaea;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #30475e;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .server-status {
            text-align: center;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid #e94560;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-online {
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .status-offline {
            background: #ff6b6b;
            box-shadow: 0 0 10px #ff6b6b;
        }

        .renderer-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .controls-panel {
            background: rgba(48, 71, 94, 0.3);
            border: 1px solid #30475e;
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e94560;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #30475e;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: #eaeaea;
            font-size: 14px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #e94560;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.3);
        }

        .canvas-container {
            background: rgba(48, 71, 94, 0.3);
            border: 1px solid #30475e;
            border-radius: 12px;
            height: 600px;
            position: relative;
            overflow: hidden;
        }

        #renderer {
            width: 100%;
            height: 100%;
        }

        .error-message {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #e94560;
        }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: rgba(48, 71, 94, 0.3);
            border: 1px solid #30475e;
            border-radius: 6px;
            color: #eaeaea;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            border-color: #e94560;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AtomView - Molecular Renderer v1.0.0</h1>
            <p>Developed by Eshant, Soham, Arush, Archit</p>
        </div>

        <div class="server-status">
            <div id="serverStatus">
                <span class="status-indicator status-offline"></span>
                Checking connection...
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="loading" id="loading">Processing molecule...</div>

        <div class="renderer-container">
            <div class="controls-panel">
                <div class="tab-container">
                    <button class="tab-btn active" onclick="switchTab('straight-chain')">Straight Chain</button>
                    <button class="tab-btn" onclick="switchTab('aromatics')">Aromatics</button>
                </div>

                <div id="straight-chain" class="tab-content active">
                    <div class="input-group">
                        <label>Straight Chain Molecule Name</label>
                        <input type="text" id="moleculeName" placeholder="e.g., ethanol, propanal" value="ethanol">
                    </div>
                    <button class="btn btn-primary" onclick="parseMolecule()">Parse & Render</button>
                </div>

                <div id="aromatics" class="tab-content">
                    <div class="input-group">
                        <label>Aromatic Molecule Name</label>
                        <input type="text" id="aromaticName" placeholder="e.g., benzene, toluene" value="benzene">
                    </div>
                    <button class="btn btn-primary" onclick="parseAromatic()">Parse & Render</button>
                </div>
            </div>

            <div class="canvas-container">
                <div id="renderer"></div>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = 'http://localhost:3000';
        let serverAvailable = false;

        // Simple server check - just test connection once
        async function checkServer() {
            try {
                console.log('Testing server connection...');
                const response = await fetch(`${SERVER_URL}/health-test`);
                const data = await response.json();
                console.log('Server response:', data);
                
                serverAvailable = data.status === 'Server running';
                updateServerStatus();
                return serverAvailable;
            } catch (error) {
                console.error('Server connection failed:', error);
                serverAvailable = false;
                updateServerStatus();
                return false;
            }
        }

        function updateServerStatus() {
            const statusElement = document.getElementById('serverStatus');
            if (serverAvailable) {
                statusElement.innerHTML = '<span class="status-indicator status-online"></span>C++ Parser Server Connected';
            } else {
                statusElement.innerHTML = '<span class="status-indicator status-offline"></span>C++ Parser Server Offline - Please run start.bat first';
            }
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            setTimeout(() => {
                errorElement.style.display = 'none';
            }, 5000);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');
        }

        async function parseMolecule() {
            if (!serverAvailable) {
                showError('Server not connected. Please run start.bat first.');
                return;
            }

            const name = document.getElementById('moleculeName').value.trim();
            if (!name) {
                showError('Please enter a molecule name');
                return;
            }

            try {
                document.getElementById('loading').style.display = 'block';
                
                const response = await fetch(`${SERVER_URL}/parse`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ moleculeName: name })
                });

                const result = await response.json();
                
                if (result.success) {
                    renderStraightChain(result.data);
                } else {
                    showError(result.error || 'Failed to parse molecule');
                }
            } catch (error) {
                showError('Error parsing molecule: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function parseAromatic() {
            if (!serverAvailable) {
                showError('Server not connected. Please run start.bat first.');
                return;
            }

            const name = document.getElementById('aromaticName').value.trim();
            if (!name) {
                showError('Please enter an aromatic molecule name');
                return;
            }

            try {
                document.getElementById('loading').style.display = 'block';
                
                const response = await fetch(`${SERVER_URL}/parse-aromatic`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ moleculeName: name })
                });

                const result = await response.json();
                
                if (result.success) {
                    renderAromatic(result.data);
                } else {
                    showError(result.error || 'Failed to parse aromatic molecule');
                }
            } catch (error) {
                showError('Error parsing aromatic molecule: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Basic Three.js setup
        let scene, camera, renderer, moleculeGroup;

        function initThreeJS() {
            const container = document.getElementById('renderer');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            moleculeGroup = new THREE.Group();
            scene.add(moleculeGroup);

            // Handle resize
            window.addEventListener('resize', () => {
                const newWidth = container.clientWidth;
                const newHeight = container.clientHeight;
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(newWidth, newHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (moleculeGroup) {
                moleculeGroup.rotation.y += 0.005;
            }
            renderer.render(scene, camera);
        }

        function renderStraightChain(data) {
            // Clear previous molecule
            while (moleculeGroup.children.length > 0) {
                moleculeGroup.remove(moleculeGroup.children[0]);
            }

            // Simple rendering for straight chain molecules
            const atomColors = {
                'C': 0x333333,
                'H': 0xffffff,
                'O': 0xff0000,
                'N': 0x0000ff,
                'F': 0x00ff00,
                'Cl': 0x00ff00,
                'Br': 0x8b4513,
                'I': 0x800080
            };

            if (Array.isArray(data)) {
                data.forEach((atom, index) => {
                    const geometry = new THREE.SphereGeometry(0.3, 32, 32);
                    const material = new THREE.MeshPhongMaterial({ 
                        color: atomColors[atom.element] || 0x888888 
                    });
                    const sphere = new THREE.Mesh(geometry, material);
                    
                    sphere.position.x = index * 1.5;
                    moleculeGroup.add(sphere);

                    // Add bonds
                    if (index > 0) {
                        const bondGeometry = new THREE.CylinderGeometry(0.1, 0.1, 1.5, 8);
                        const bondMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
                        const bond = new THREE.Mesh(bondGeometry, bondMaterial);
                        bond.position.x = (index - 0.5) * 1.5;
                        bond.rotation.z = Math.PI / 2;
                        moleculeGroup.add(bond);
                    }
                });
            }
        }

        function renderAromatic(data) {
            // Clear previous molecule
            while (moleculeGroup.children.length > 0) {
                moleculeGroup.remove(moleculeGroup.children[0]);
            }

            // Simple benzene ring rendering
            const atomColors = {
                'C': 0x333333,
                'H': 0xffffff,
                'N': 0x0000ff,
                'O': 0xff0000,
                'S': 0xffff00
            };

            const ringGeometry = new THREE.BufferGeometry();
            const vertices = [];
            
            // Create hexagon for benzene
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                vertices.push(Math.cos(angle) * 2, Math.sin(angle) * 2, 0);
            }
            
            ringGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const ringMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
            const ring = new THREE.Line(ringGeometry, ringMaterial);
            moleculeGroup.add(ring);

            // Add carbon atoms
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const geometry = new THREE.SphereGeometry(0.3, 32, 32);
                const material = new THREE.MeshPhongMaterial({ color: atomColors['C'] });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(Math.cos(angle) * 2, Math.sin(angle) * 2, 0);
                moleculeGroup.add(sphere);
            }
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            initThreeJS();
            checkServer(); // Check server connection
            
            // Auto-parse default molecule after server check
            setTimeout(() => {
                if (serverAvailable) {
                    parseMolecule();
                }
            }, 1000);
        });
    </script>
</body>
</html>
