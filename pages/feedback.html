<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtomView - Feedback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Atomic+Age&display=swap" rel="stylesheet">
    <style>
        :root {
            --base-clr: #11121a;
            --line-clr: #42434a;
            --hover-clr: #151943;
            --text-clr: #e6e6ef;
            --accent-clr: #ff845e;
            --accent-clr-2: #fcff43;
            --accent-clr-3: #5eff5e;
            --accent-clr-4: #6affe6;
            --accent-clr-5: #6aa1ff;
            --secondary-text-clr: #b0b3c1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
        }

        body {
            background-color: var(--base-clr);
            color: var(--text-clr);
            min-height: 100vh;
        }

        .logo {
            font-family: 'Atomic Age', cursive;
            font-weight: 600;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(17, 18, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line-clr);
            z-index: 1000;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            color: var(--accent-clr);
            font-size: 1.5rem;
            text-decoration: none;
        }

        nav .back-btn {
            color: var(--text-clr);
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid var(--line-clr);
            border-radius: 8px;
            transition: all 0.3s;
        }

        nav .back-btn:hover {
            background: var(--hover-clr);
            border-color: var(--accent-clr);
        }

        /* Main Content */
        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .feedback-container {
            width: 100%;
            background: var(--hover-clr);
            border: 1px solid var(--line-clr);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 2rem;
            color: var(--accent-clr);
            margin-bottom: 10px;
        }

        .page-header p {
            color: var(--secondary-text-clr);
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-clr);
            font-weight: 500;
            font-size: 1rem;
        }

        .form-group textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            background: var(--base-clr);
            border: 2px solid var(--line-clr);
            border-radius: 8px;
            color: var(--text-clr);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            resize: vertical;
            transition: all 0.3s;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-clr);
            box-shadow: 0 0 0 3px rgba(255, 132, 94, 0.1);
        }

        .form-group textarea::placeholder {
            color: var(--secondary-text-clr);
        }

        .submit-btn {
            width: 100%;
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--accent-clr) 0%, var(--accent-clr-5) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 132, 94, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 20px;
            background: rgba(94, 255, 94, 0.1);
            border: 2px solid var(--accent-clr-3);
            border-radius: 8px;
            color: var(--accent-clr-3);
            margin-top: 20px;
        }

        .success-message.show {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                padding: 12px 20px;
            }

            nav .logo {
                font-size: 1.2rem;
            }

            nav .back-btn {
                padding: 8px 16px;
                font-size: 0.9rem;
            }

            main {
                padding: 80px 15px 30px;
            }

            .feedback-container {
                padding: 25px;
            }

            .page-header h1 {
                font-size: 1.6rem;
            }

            .page-header p {
                font-size: 0.9rem;
            }

            .form-group textarea {
                min-height: 150px;
                padding: 12px;
                font-size: 0.95rem;
            }

            .submit-btn {
                padding: 12px 24px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            nav {
                padding: 10px 15px;
            }

            nav .logo {
                font-size: 1rem;
            }

            nav .back-btn {
                padding: 6px 12px;
                font-size: 0.85rem;
            }

            main {
                padding: 70px 12px 25px;
            }

            .feedback-container {
                padding: 20px;
            }

            .page-header h1 {
                font-size: 1.4rem;
            }

            .page-header p {
                font-size: 0.85rem;
            }

            .form-group label {
                font-size: 0.9rem;
            }

            .form-group textarea {
                min-height: 120px;
                padding: 10px;
                font-size: 0.9rem;
            }

            .submit-btn {
                padding: 10px 20px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="../atomview_main.html" class="logo">AtomView</a>
        <a href="../atomview_main.html" class="back-btn">Back to Homepage</a>
    </nav>

    <main>
        <div class="feedback-container">
            <div class="page-header">
                <h1>Feedback</h1>
                <p>We value your opinion! Please share your thoughts with us.</p>
            </div>

            <form id="feedbackForm">
                <div class="form-group">
                    <label for="feedbackText">Please provide your valuable feedback</label>
                    <textarea 
                        id="feedbackText" 
                        name="feedback" 
                        placeholder="Share your thoughts, suggestions, or report any issues..."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Feedback</button>
            </form>

            <div class="success-message" id="successMessage">
                Thank you for your feedback! We appreciate your input.
            </div>
        </div>
    </main>

    <script>
        document.getElementById('feedbackForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const feedbackText = document.getElementById('feedbackText').value.trim();
            const submitBtn = document.querySelector('.submit-btn');
            
            if (feedbackText) {
                // Disable button and show loading state
                submitBtn.disabled = true;
                submitBtn.textContent = 'Submitting...';
                
                try {
                    // Submit to API
                    const response = await fetch('/api/submit-feedback', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ feedback: feedbackText })
                    });
                    
                    const result = await response.json();
                    
                    if (response.ok && result.success) {
                        // Show success message
                        document.getElementById('successMessage').classList.add('show');
                        
                        // Clear form
                        document.getElementById('feedbackText').value = '';
                        
                        // Hide success message after 5 seconds
                        setTimeout(() => {
                            document.getElementById('successMessage').classList.remove('show');
                        }, 5000);
                    } else {
                        alert('Failed to submit feedback. Please try again.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to submit feedback. Please try again.');
                } finally {
                    // Re-enable button
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Feedback';
                }
            }
        });
    </script>
</body>
</html>
